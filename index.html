<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#F7F2E9">
  <title>小游戏</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <section id="lobby" class="screen">
      <div class="lobby-card">
        <div class="cover">
          <div>
            <h1>小游戏</h1>
          </div>
          <div class="cover-badge">游</div>
        </div>

        <div id="game-list" class="game-list"></div>
        <p class="footer">无需网络 · 首次加载后离线可玩</p>
      </div>
    </section>

    <section id="game" class="screen hidden">
      <header class="game-top">
        <button id="back-btn" class="btn ghost" type="button">‹ 大厅</button>
        <h2 id="game-title">游戏</h2>
        <div class="top-spacer"></div>
      </header>
      <div id="game-body"></div>
    </section>
  </div>

  <div id="dialog-overlay" class="overlay hidden">
    <div class="dialog">
      <h3 id="dialog-title"></h3>
      <p id="dialog-message"></p>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn" type="button"></button>
        <button id="dialog-confirm" class="btn primary" type="button"></button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
