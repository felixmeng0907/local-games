<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#F7F2E9">
  <title>本机小游戏</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <section id="lobby" class="screen">
      <div class="lobby-card">
        <div class="cover">
          <div>
            <h1>本机小游戏</h1>
            <p class="subtitle">离线 · 同屏双人 · 轻快开玩</p>
          </div>
          <div class="cover-badge">五</div>
        </div>
        <h2 class="section-title">选择游戏</h2>
        <button id="gomoku-card" class="game-card" type="button">
          <span class="game-icon">● ○</span>
          <span class="game-info">
            <span class="game-name">五子棋</span>
            <span class="game-sub">本地双人 · 15×15</span>
          </span>
          <span class="game-arrow">›</span>
        </button>
        <p class="footer">本地双人 · 无需网络</p>
      </div>
    </section>

    <section id="game" class="screen hidden">
      <header class="game-top">
        <button id="back-btn" class="btn ghost" type="button">‹ 大厅</button>
        <h2 class="game-title">五子棋</h2>
        <div class="top-spacer"></div>
      </header>
      <div id="turn-label" class="turn-label">● 黑方回合</div>
      <div class="board-wrap">
        <canvas id="board"></canvas>
      </div>
      <div class="actions">
        <button id="undo-btn" class="btn" type="button" disabled>悔棋</button>
        <button id="restart-btn" class="btn primary" type="button">重新开始</button>
      </div>
    </section>
  </div>

  <div id="dialog-overlay" class="overlay hidden">
    <div class="dialog">
      <h3 id="dialog-title"></h3>
      <p id="dialog-message"></p>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn" type="button"></button>
        <button id="dialog-confirm" class="btn primary" type="button"></button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
